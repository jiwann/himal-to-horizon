name: Sync Visa Data

on:
  schedule:
    - cron: "0 3 * * 1"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Run sync script
        run: node scripts/sync_visa_data.mjs

      - name: Check for changes
        id: diff
        run: |
          # visa-sync-status.json gets a new lastChecked date every run, so the
          # site can show when the data was last checked; passport-index.json
          # only changes when a visa rule does.
          git diff --quiet client/src/lib/passport-index.json client/src/lib/visa-sync-status.json && echo "changed=false" >> $GITHUB_OUTPUT || echo "changed=true" >> $GITHUB_OUTPUT

      - name: Commit refreshed visa data
        if: steps.diff.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add client/src/lib/passport-index.json client/src/lib/visa-sync-status.json
          if git diff --cached --quiet client/src/lib/passport-index.json; then
            git commit -m "chore: visa data checked, no changes [$(date -u +%Y-%m-%d)]"
          else
            git commit -m "chore: auto-refresh passport-index.json [$(date -u +%Y-%m-%d)]"
          fi
          git push
